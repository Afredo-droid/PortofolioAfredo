name: my_portfolio
description: "Aplikasi Portfolio Mahasiswa Teknik Informatika"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo_aplikasi.png
    - assets/profile.jpg
    - assets/e_speed.png
    - assets/djawara_go.png
    - assets/portfolio_uiux.png